version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15
    container_name: nl2sql_database
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./data/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./data/seed_data.sql:/docker-entrypoint-initdb.d/02-seed_data.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: nl2sql_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Neo4j Graph Database (Optional for graph queries)
  neo4j:
    image: neo4j:5.13
    container_name: nl2sql_neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - ./data/neo4j_setup.cypher:/var/lib/neo4j/import/setup.cypher
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: nl2sql_api
    ports:
      - "8000:8000"
    environment:
      # Database configuration
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ecommerce
      DB_USER: user
      DB_PASSWORD: password
      
      # Ollama configuration
      OLLAMA_URL: http://ollama:11434
      MODEL_NAME: llama3.1:8b
      
      # Neo4j configuration (optional)
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    depends_on:
      database:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./nl2sql:/app/nl2sql
      - ./data:/app/data
      - ./tests:/app/tests
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
  neo4j_data:
    driver: local

networks:
  default:
    name: nl2sql_network